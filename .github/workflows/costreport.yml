name: 'Azure Cost API'

on:
  workflow_dispatch:
  schedule:
    - cron: '41 3 * * *' # runs nightly at 3:41 am

#Special permissions required for OIDC authentication
permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs: 
  plan:	
    name: Azure Cost API
    runs-on: ubuntu-latest
    environment: tfplan
    steps:
    - uses: actions/checkout@v2
    - name: List files in the current directory
      run: |
        pwd
        ls -l
    - name: Azure CLI Login
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_AD_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_AD_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  
    - name: Azure CLI script
      uses: azure/cli@v2
      with:
        azcliversion: latest
        inlineScript: |
          az --version
          az account show
          # You can write your Azure CLI inline scripts here.

    - name: install tool azure-cost-cli
      run: |
        pwd
        dotnet tool install -g azure-cost-cli 
        azure-cost accumulatedCost -o markdown > cost-report.md
      
    - name: List files in the current directory
      run: |
        pwd
        ls -lat
        
    - name: Upload the cost-report.md file
      uses: actions/upload-artifact@v4
      with:
        name: AzureCostReport
        include-hidden-files: true
        path: cost-report.md
  



          
        
