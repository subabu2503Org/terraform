name: 'Execute Scripts'

on:
  workflow_dispatch:
   
env:
  actions_working_dir: scripts
  
#Special permissions required for OIDC authentication
permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs: 
  plan:	
    name: Create Linux VM
    runs-on: ubuntu-latest
    environment: tfplan
    defaults:
      run:
        working-directory: ${{ env.actions_working_dir }}
    
    steps:
    - uses: actions/checkout@v2
    - name: List files in the current directory
      run: |
        pwd
        ls -l
        chmod 744 create-linux-vm.sh
        
    - name: Recursively List files in the github.workspace
      run: |
        ls -lR ${{ github.workspace }}
  
    - name: Azure CLI Login
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_AD_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_AD_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  
    - name: Azure CLI script
      uses: azure/cli@v2
      with:
        azcliversion: latest
        inlineScript: |
          az --version
          #az account show
          # You can write your Azure CLI inline scripts here.
     
    - name: Run a script from a file to create a linux VM
      run: ./create-linux-vm.sh
      
    - name: List files in the current directory
      run: |
        pwd
        ls -lat
      
    - name: Run inline scripts and create cert files
      run: |
        pwd
        echo "copying id_rsa.pub to current directory"
        cat /home/runner/.ssh/id_rsa.pub  > id_rsa.pub
        pwd
        ls -lat
        
        echo "copying id_rsa to current directory"
        cat /home/runner/.ssh/id_rsa  > id_rsa.pem
        pwd
        ls -lat
          
    - name: Upload the cloud-init-apache.txt file
      uses: actions/upload-artifact@v4
      with:
        name: cloud-init-apache
        include-hidden-files: true
        path: cloud-init-apache.txt
          
    - name: Upload the id_rsa.pub file
      uses: actions/upload-artifact@v4
      with:
        name: id_rsa-pub
        include-hidden-files: true
        path: id_rsa.pub
          
    - name: Upload the id_rsa-pem file
      uses: actions/upload-artifact@v4
      with:
        name: id_rsa-pem
        include-hidden-files: true
        path: id_rsa.pem
  

          
